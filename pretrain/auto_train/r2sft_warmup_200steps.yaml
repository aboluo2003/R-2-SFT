# ============================================================================
# R²-SFT warm-up scorer — 200 step SFT-PPL scorer training
# ============================================================================
# Purpose:
#   Train a 200-step SFT model on the raw (unfiltered) R²-SFT data as the
#   SID-PPL scorer used in the downstream PPL filtering step.
#
# Data: r2sft_warmup_raw.json
#   Generated by: bash data/onerec_data/sft/cot/3_ppl_eval/main_version/0_build_warmup_data.sh
#   CoT source: data/RecIF-cot/steps/2_cot (unfiltered raw CoT)
#
# Training params (identical to the main SFT except save_checkpoint_per_step/max_step=200):
#   - num_training_steps=6600 (lr scheduler shape kept from main recipe)
#   - save_checkpoint_per_step=200
#   - lr=5e-6, min_lr=1e-7, weight_decay=0.1, cosine, warmup=50
#   - ENABLE_TARGET_LOSS=1
#
# Launch (from the pretrain/ directory):
#   cd pretrain
#   python3 auto_train/auto_train.py auto_train/r2sft_warmup_200steps.yaml
# ============================================================================

default_max_step: 200
default_eval_name: r2sft_warmup_200steps
default_eval_think: false
default_eval_nothink: false
default_eval_all_checkpoints: false
data_version: v1.0

experiments:
  - label: r2sft_warmup_200steps
    run_script: examples/r2sft_warmup_200steps.sh
    max_step: 200
    eval_name: r2sft_warmup_200steps
    eval_think: false
    eval_nothink: false
    eval_all_checkpoints: false
