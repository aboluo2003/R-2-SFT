# ============================================================================
# R²-SFT main SFT — target-aware SFT on PPL-filtered CoT (★ main output)
# ============================================================================
# Train the main R²-SFT model on the PPL-filtered CoT data. The CoT portion
# is re-scored with the 200-step warm-up scorer (r2sft_warmup_200steps.yaml)
# and filtered by PPL gain before being mixed with non-CoT rec + caption tasks.
#
# Data: r2sft_sft_ppl.json
#   Generated by: bash data/onerec_data/sft/cot/3_ppl_eval/main_version/5_data_format.sh
#   Composition (video + ad only; product not open-sourced):
#     - PPL-filtered CoT (scorer = r2sft_warmup_200steps step200)
#     - non-CoT rec (video + ad)
#     - caption2sid + sid2caption (video + ad)
#     - SPLIT_TARGET=1, TARGET_MAX_LEN=3
#
# Prerequisites:
#   1. bash data/onerec_data/sft/cot/3_ppl_eval/main_version/0_build_warmup_data.sh
#   2. cd pretrain && python3 auto_train/auto_train.py auto_train/r2sft_warmup_200steps.yaml
#   3. bash data/onerec_data/sft/cot/3_ppl_eval/main_version/1_preprocess.sh
#   4. bash data/onerec_data/sft/cot/3_ppl_eval/main_version/2_eval_ppl.sh
#   5. bash data/onerec_data/sft/cot/3_ppl_eval/main_version/3_join.sh
#   6. First annotate to get p50, then threshold filter:
#      bash data/onerec_data/sft/cot/3_ppl_eval/main_version/4_filter.sh
#      MAX_LOG_PPL_COT=<p50> bash data/onerec_data/sft/cot/3_ppl_eval/main_version/4_filter.sh
#
# Training params:
#   - max_step=8250
#   - num_training_steps=6600, save_checkpoint_per_step=1650
#   - ENABLE_TARGET_LOSS=1
#
# Launch (from the pretrain/ directory):
#   cd pretrain
#   python3 auto_train/auto_train.py auto_train/r2sft_sft_ppl.yaml
# ============================================================================

default_max_step: 8250
default_eval_name: r2sft_sft_ppl
default_eval_think: true
default_eval_nothink: true
default_eval_all_checkpoints: false
default_eval_steps: [6600, 8250]
data_version: v1.0

experiments:
  - label: r2sft_sft_ppl
    run_script: examples/r2sft_sft_ppl.sh
    max_step: 8250
    eval_name: r2sft_sft_ppl
    eval_think: true
    eval_nothink: true
    eval_all_checkpoints: false
    eval_steps: [6600]
